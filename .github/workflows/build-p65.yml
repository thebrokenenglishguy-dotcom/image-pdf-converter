name: Build P65 converter

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-p65.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  build-p65:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential cmake wget xz-utils libboost-all-dev zlib1g-dev

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Build librevenge
        shell: bash
        run: |
          set -e
          wget -q https://dev-www.libreoffice.org/src/librevenge-0.0.6.tar.bz2 -O librevenge.tar.bz2
          tar -xf librevenge.tar.bz2
          cd librevenge-0.0.6
          export CPPFLAGS="-I/usr/include"
          export CXXFLAGS="-O3 -I/usr/include"
          emconfigure ./configure --disable-shared --enable-static --prefix="$GITHUB_WORKSPACE/p65/deps"
          emmake make -j2
          emmake make install

      - name: Build libpagemaker and pmd2svg as WebAssembly
        shell: bash
        run: |
          set -e
          wget -q https://dev-www.libreoffice.org/src/libpagemaker/libpagemaker-0.0.4.tar.xz -O libpagemaker.tar.xz
          tar -xf libpagemaker.tar.xz
          cd libpagemaker-0.0.4

          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/p65/deps/lib/pkgconfig"
          export CPPFLAGS="-I/usr/include"
          export CXXFLAGS="-O3 -I/usr/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/p65/deps/lib"

          emconfigure ./configure --disable-shared --enable-static --prefix="$GITHUB_WORKSPACE/p65/deps"
          emmake make -j2
          emmake make install

          cd "$GITHUB_WORKSPACE"
          mkdir -p p65/dist

          em++ -O3 -s WASM=1 -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT=web -s ALLOW_MEMORY_GROWTH=1 -s FORCE_FILESYSTEM=1 -s NO_EXIT_RUNTIME=1 -s EXPORTED_RUNTIME_METHODS='["FS","callMain"]' -I"$GITHUB_WORKSPACE/p65/deps/include" libpagemaker-0.0.4/src/conv/svg/pmd2svg.cpp -o "$GITHUB_WORKSPACE/p65/dist/pmd2svg.js" $(pkg-config --static --cflags --libs libpagemaker-0.0)

      - name: Verify generated P65 engine
        run: |
          test -s p65/dist/pmd2svg.js
          test -s p65/dist/pmd2svg.wasm

      - name: Commit generated P65 engine
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p65/dist
          if git diff --cached --quiet; then
            echo "No P65 engine changes."
          else
            git commit -m "Build PageMaker P65 WebAssembly engine"
            git push
          fi
